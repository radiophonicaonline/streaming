<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>Mapa de Oyentes en Vivo</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>


<style>

body {

  font-family:
    Arial,
    sans-serif;

  margin: 0;
  padding: 0;

}


#container {

  display: flex;
  flex-wrap: wrap;

}


#map {

  flex: 2;

  height: 500px;

  min-width: 300px;

}


#stats {

  flex: 1;

  padding: 10px;

  background: #f9f9f9;

  border-left:
    1px solid #ccc;

}


h3 {

  margin-top: 0;

}


ul {

  list-style: none;

  padding: 0;

}


li {

  padding: 7px 5px;

  border-bottom:
    1px solid #ddd;

}


.estado {

  font-size: 13px;

  color: #666;

}


@media
(max-width: 700px) {

  #container {

    display: block;

  }


  #map {

    width: 100%;

    height: 400px;

  }


  #stats {

    border-left: none;

  }

}

</style>

</head>


<body>


<div id="container">


<div id="map"></div>


<div id="stats">


<h3>
Oyentes en Tiempo Real por Región
</h3>


<ul
  id="regionListTiempoReal">
</ul>


<p>

Total conectados ahora:

<strong>
<span id="totalTiempoReal">
0
</span>
</strong>

</p>


<p class="estado">

🟢 Se consideran activos los dispositivos
detectados durante los últimos 90 segundos.

</p>


<h3>
Oyentes Diarios por Región
</h3>


<ul
  id="regionListDiario">
</ul>


<p>

Total diario:

<strong>
<span id="totalDiario">
0
</span>
</strong>

</p>


</div>

</div>



<script type="module">


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";


import {

  getDatabase,
  ref,
  onValue

}
from
"https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";


import L
from
"https://cdn.skypack.dev/leaflet";



// ======================================================
// FIREBASE
// ======================================================

const firebaseConfig = {

  apiKey:
    "AIzaSyAC-9LQSlelDVx27wd2DPxisi4M-lRwtrk",

  authDomain:
    "contador-de-personas-5f8aa.firebaseapp.com",

  databaseURL:
    "https://contador-de-personas-5f8aa-default-rtdb.firebaseio.com",

  projectId:
    "contador-de-personas-5f8aa",

  storageBucket:
    "contador-de-personas-5f8aa.appspot.com",

  messagingSenderId:
    "1063230344919",

  appId:
    "1:1063230344919:web:ed86a937ba176dddb1aa92"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);



// ======================================================
// MAPA
// ======================================================

const map =
  L.map("map")
   .setView(
     [-33.45, -70.66],
     5
   );


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 18,

    attribution:
      "&copy; OpenStreetMap"

  }

).addTo(map);



let markers = {};

let conexionesActuales = {};


// 90 segundos

const TIEMPO_ACTIVO =
  90 * 1000;



// ======================================================
// FIREBASE EN TIEMPO REAL
// ======================================================

onValue(

  ref(db, "conexiones"),

  snapshot => {

    conexionesActuales =
      snapshot.val() || {};

    actualizarMapa();

  }

);



// ======================================================
// ACTUALIZAR MAPA
// ======================================================

function actualizarMapa() {


  // Quitar marcadores anteriores

  Object.values(markers)
    .forEach(marker => {

      map.removeLayer(marker);

    });


  markers = {};


  const ahora =
    Date.now();


  const regiones = {};


  let total = 0;


  let posiciones = [];


  // ==================================================
  // RECORRER CONEXIONES
  // ==================================================

  for (
    const [id, conn]
    of Object.entries(conexionesActuales)
  ) {


    if (!conn) continue;


    // ----------------------------------------------
    // TIMESTAMP
    // ----------------------------------------------

    const timestamp =
      Number(conn.timestamp);


    if (
      !Number.isFinite(timestamp)
    ) {

      continue;

    }


    const antiguedad =
      ahora - timestamp;


    // ----------------------------------------------
    // MÁS DE 90 SEGUNDOS = INACTIVO
    // ----------------------------------------------

    if (
      antiguedad < 0 ||
      antiguedad > TIEMPO_ACTIVO
    ) {

      continue;

    }


    // ----------------------------------------------
    // UBICACIÓN
    // ----------------------------------------------

    if (!conn.ubicacion) {

      continue;

    }


    const ubicacion =
      conn.ubicacion;


    const lat =
      Number(ubicacion.lat);


    const lon =
      Number(ubicacion.lon);


    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ) {

      continue;

    }


    // ----------------------------------------------
    // CONEXIÓN VÁLIDA
    // ----------------------------------------------

    total++;


    posiciones.push(
      [lat, lon]
    );


    const region =
      ubicacion.region ||
      "Desconocida";


    regiones[region] =
      (regiones[region] || 0) + 1;


    // ----------------------------------------------
    // MARCADOR
    // ----------------------------------------------

    const marker =
      L.marker(
        [lat, lon]
      )

      .addTo(map)

      .bindPopup(`

        📍
        ${ubicacion.city || "Desconocida"},
        ${region},
        ${ubicacion.country || "Desconocido"}

        <br><br>

        ${conn.dispositivo || "Dispositivo desconocido"}

        <br>

        🌐
        ${conn.pagina || "/"}

        <br><br>

        🟢 Activo ahora

      `);


    markers[id] =
      marker;

  }



  // ==================================================
  // CONTADORES
  // ==================================================

  mostrarLista(

    regiones,

    "regionListTiempoReal",

    "Sin oyentes activos"

  );


  document
    .getElementById(
      "totalTiempoReal"
    )
    .textContent =
      total;



  // ==================================================
  // AJUSTAR MAPA A LOS OYENTES
  // ==================================================

  if (
    posiciones.length === 1
  ) {

    map.setView(
      posiciones[0],
      10
    );

  }


  if (
    posiciones.length > 1
  ) {

    map.fitBounds(
      posiciones,
      {

        padding:
          [40, 40]

      }
    );

  }

}



// ======================================================
// REVISIÓN AUTOMÁTICA
//
// Esto hace que una conexión vencida desaparezca
// aunque Firebase no genere otro evento.
// ======================================================

setInterval(

  actualizarMapa,

  15000

);



// ======================================================
// OYENTES DIARIOS
// ======================================================

const hoy =
  new Date()
    .toISOString()
    .split("T")[0];


onValue(

  ref(
    db,
    `conexiones_diarias/${hoy}`
  ),

  snapshot => {


    const data =
      snapshot.val() || {};


    let total =
      0;


    for (
      const valor
      of Object.values(data)
    ) {

      total +=
        Number(valor) || 0;

    }


    mostrarLista(

      data,

      "regionListDiario",

      "Sin oyentes registrados hoy"

    );


    document
      .getElementById(
        "totalDiario"
      )
      .textContent =
        total;

  }

);



// ======================================================
// MOSTRAR LISTAS
// ======================================================

function mostrarLista(
  datos,
  elementoId,
  mensajeVacio
) {


  const ul =
    document.getElementById(
      elementoId
    );


  ul.innerHTML =
    "";


  const elementos =
    Object.entries(datos)

    .sort(
      (a, b) =>
        Number(b[1]) -
        Number(a[1])
    );


  if (
    elementos.length === 0
  ) {

    const li =
      document.createElement(
        "li"
      );


    li.textContent =
      mensajeVacio;


    ul.appendChild(li);


    return;

  }


  elementos.forEach(
    ([region, cantidad]) => {


      const li =
        document.createElement(
          "li"
        );


      li.textContent =
        `${region}: ${cantidad} oyente(s)`;


      ul.appendChild(li);

    }
  );

}


</script>


</body>

</html>
