<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mapa de Oyentes - Radiophonica</title>

  <!-- LEAFLET -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* =========================================
       CABECERA
    ========================================= */

    #cabecera {
      background: #181818;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    #cabecera h1 {
      margin: 0 0 12px 0;
      font-size: 25px;
    }

    #resumen {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tarjeta {
      background: #242424;
      border-radius: 10px;
      padding: 10px 16px;
      min-width: 150px;
      font-size: 14px;
    }

    .tarjeta strong {
      display: block;
      font-size: 22px;
      margin-top: 4px;
    }

    /* =========================================
       MAPA
    ========================================= */

    #map {
      width: 100%;
      height: 65vh;
      min-height: 430px;
    }

    /* =========================================
       LEYENDA
    ========================================= */

    #leyenda {
      background: #181818;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      border-top: 1px solid #333;
    }

    .leyenda-item {
      display: inline-block;
      margin: 5px 10px;
    }

    .punto {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .punto-web {
      background: #3388ff;
    }

    .punto-oyente {
      background: #20c997;
    }

    .punto-mixto {
      background: #ffb020;
    }

    /* =========================================
       ESTADÍSTICAS
    ========================================= */

    #estadisticas {
      padding: 20px;
      background: #111;
    }

    #estadisticas h2 {
      margin-top: 0;
      text-align: center;
    }

    #lista-regiones {
      max-width: 700px;
      margin: auto;
      background: #1d1d1d;
      border-radius: 10px;
      padding: 15px;
    }

    .region {
      display: flex;
      justify-content: space-between;
      padding: 8px 5px;
      border-bottom: 1px solid #333;
    }

    .region:last-child {
      border-bottom: none;
    }

    /* =========================================
       MARCADOR AGRUPADO
    ========================================= */

    .marcador-cantidad {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(0,0,0,.65);
    }

    /* =========================================
       MÓVIL
    ========================================= */

    @media (max-width: 600px) {

      #cabecera h1 {
        font-size: 21px;
      }

      .tarjeta {
        min-width: 135px;
        padding: 8px 10px;
      }

      .tarjeta strong {
        font-size: 19px;
      }

      #map {
        height: 60vh;
        min-height: 380px;
      }

    }

  </style>

</head>

<body>


  <!-- =========================================
       CABECERA
  ========================================= -->

  <div id="cabecera">

    <h1>
      🌎 Radiophonica en vivo
    </h1>

    <div id="resumen">

      <div class="tarjeta">
        👥 En la web
        <strong id="total-web">0</strong>
      </div>

      <div class="tarjeta">
        🎧 Escuchando ahora
        <strong id="total-oyentes">0</strong>
      </div>

      <div class="tarjeta">
        📺 Principal
        <strong id="total-principal">0</strong>
      </div>

      <div class="tarjeta">
        📱 Vertical
        <strong id="total-vertical">0</strong>
      </div>

    </div>

  </div>


  <!-- =========================================
       MAPA
  ========================================= -->

  <div id="map"></div>


  <!-- =========================================
       LEYENDA
  ========================================= -->

  <div id="leyenda">

    <span class="leyenda-item">
      <span class="punto punto-web"></span>
      Visitantes web
    </span>

    <span class="leyenda-item">
      <span class="punto punto-oyente"></span>
      Oyentes
    </span>

    <span class="leyenda-item">
      <span class="punto punto-mixto"></span>
      Web + oyentes
    </span>

  </div>


  <!-- =========================================
       ESTADÍSTICAS DIARIAS
  ========================================= -->

  <div id="estadisticas">

    <h2>
      📊 Visitas de hoy por región
    </h2>

    <div id="lista-regiones">
      Cargando estadísticas...
    </div>

  </div>


  <!-- =========================================
       LEAFLET
  ========================================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- =========================================
       FIREBASE
  ========================================= -->

  <script type="module">

    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";


    import {
      getDatabase,
      ref,
      onValue
    }
    from
    "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAC-9LQSlelDVx27wd2DPxisi4M-lRwtrk",

      authDomain:
        "contador-de-personas-5f8aa.firebaseapp.com",

      databaseURL:
        "https://contador-de-personas-5f8aa-default-rtdb.firebaseio.com",

      projectId:
        "contador-de-personas-5f8aa",

      storageBucket:
        "contador-de-personas-5f8aa.appspot.com",

      messagingSenderId:
        "1063230344919",

      appId:
        "1:1063230344919:web:ed86a937ba176dddb1aa92"

    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getDatabase(app);


    /* =========================================
       MAPA
    ========================================= */

    const map =
      L.map("map")
        .setView(
          [-20, -60],
          3
        );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }
    ).addTo(map);


    const capaMarcadores =
      L.layerGroup()
        .addTo(map);


    /* =========================================
       TIEMPOS
    ========================================= */

    /*
       Una conexión se considera activa
       si su último heartbeat tiene
       menos de 90 segundos.
    */

    const TIEMPO_ACTIVO =
      90 * 1000;


    /*
       Permitimos hasta 2 minutos hacia
       el futuro para evitar problemas
       por diferencias de reloj entre
       PC, móvil y navegador.
    */

    const TOLERANCIA_RELOJ =
      120 * 1000;


    /* =========================================
       DATOS FIREBASE
    ========================================= */

    let conexionesWeb = {};

    let oyentesEnVivo = {};


    /* =========================================
       COMPROBAR SI ESTÁ ACTIVO
    ========================================= */

    function estaActivo(registro) {

      if (!registro) {
        return false;
      }


      const timestamp =
        Number(registro.timestamp);


      if (!Number.isFinite(timestamp)) {
        return false;
      }


      const diferencia =
        Date.now() - timestamp;


      /*
         Puede tener hasta 90 segundos
         de antigüedad.

         También puede estar hasta
         120 segundos en el futuro
         por diferencias de reloj.
      */

      return (
        diferencia <= TIEMPO_ACTIVO &&
        diferencia >= -TOLERANCIA_RELOJ
      );

    }


    /* =========================================
       UBICACIÓN
    ========================================= */

    function obtenerUbicacion(registro) {

      if (
        !registro ||
        !registro.ubicacion
      ) {
        return null;
      }


      const u =
        registro.ubicacion;


      /*
         IMPORTANTE:
         primero verificamos null
         antes de convertir a Number.
      */

      if (
        u.lat === null ||
        u.lat === undefined ||
        u.lon === null ||
        u.lon === undefined
      ) {
        return null;
      }


      const lat =
        Number(u.lat);


      const lon =
        Number(u.lon);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {
        return null;
      }


      return {

        lat,
        lon,

        city:
          u.city ||
          "Ciudad desconocida",

        region:
          u.region ||
          "Región desconocida",

        country:
          u.country ||
          "País desconocido"

      };

    }


    /* =========================================
       ESCAPAR HTML
    ========================================= */

    function escapar(valor) {

      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================================
       CREAR CLAVE DE UBICACIÓN
    ========================================= */

    function crearClaveUbicacion(ubicacion) {

      /*
         Agrupamos principalmente por
         ciudad + región + país.

         Esto evita que PC y móvil
         conectados al mismo Wi-Fi
         queden uno encima del otro.
      */

      return [
        ubicacion.city,
        ubicacion.region,
        ubicacion.country
      ]
      .join("|")
      .toLowerCase();

    }


    /* =========================================
       CREAR GRUPO
    ========================================= */

    function crearGrupo(ubicacion) {

      return {

        ubicacion,

        web: 0,

        principal: 0,

        vertical: 0,

        dispositivosWeb: [],

        dispositivosOyentes: [],

        paginas: []

      };

    }


    /* =========================================
       ACTUALIZAR MAPA
    ========================================= */

    function actualizarMapa() {

      capaMarcadores.clearLayers();


      let totalWeb =
        0;

      let totalOyentes =
        0;

      let totalPrincipal =
        0;

      let totalVertical =
        0;


      const grupos = {};


      /* =====================================
         VISITANTES WEB
      ===================================== */

      Object.values(
        conexionesWeb
      ).forEach(
        conexion => {

          if (!estaActivo(conexion)) {
            return;
          }


          totalWeb++;


          const ubicacion =
            obtenerUbicacion(conexion);


          if (!ubicacion) {
            return;
          }


          const clave =
            crearClaveUbicacion(
              ubicacion
            );


          if (!grupos[clave]) {

            grupos[clave] =
              crearGrupo(
                ubicacion
              );

          }


          grupos[clave].web++;


          const dispositivo =
            conexion.dispositivo ||
            "Desconocido";


          grupos[clave]
            .dispositivosWeb
            .push(
              dispositivo
            );


          if (conexion.pagina) {

            grupos[clave]
              .paginas
              .push(
                conexion.pagina
              );

          }

        }
      );


      /* =====================================
         OYENTES
      ===================================== */

      Object.values(
        oyentesEnVivo
      ).forEach(
        oyente => {

          if (!estaActivo(oyente)) {
            return;
          }


          totalOyentes++;


          const tipo =
            oyente.tipo ||
            "principal";


          if (tipo === "vertical") {

            totalVertical++;

          }
          else {

            totalPrincipal++;

          }


          const ubicacion =
            obtenerUbicacion(oyente);


          if (!ubicacion) {
            return;
          }


          const clave =
            crearClaveUbicacion(
              ubicacion
            );


          if (!grupos[clave]) {

            grupos[clave] =
              crearGrupo(
                ubicacion
              );

          }


          if (tipo === "vertical") {

            grupos[clave].vertical++;

          }
          else {

            grupos[clave].principal++;

          }


          grupos[clave]
            .dispositivosOyentes
            .push(
              oyente.dispositivo ||
              "Desconocido"
            );

        }
      );


      /* =====================================
         ACTUALIZAR CONTADORES
      ===================================== */

      document
        .getElementById(
          "total-web"
        )
        .textContent =
          totalWeb;


      document
        .getElementById(
          "total-oyentes"
        )
        .textContent =
          totalOyentes;


      document
        .getElementById(
          "total-principal"
        )
        .textContent =
          totalPrincipal;


      document
        .getElementById(
          "total-vertical"
        )
        .textContent =
          totalVertical;


      /* =====================================
         CREAR MARCADORES AGRUPADOS
      ===================================== */

      Object.values(
        grupos
      ).forEach(
        grupo => {


          const totalEscuchando =
            grupo.principal +
            grupo.vertical;


          const totalLugar =
            grupo.web +
            totalEscuchando;


          /*
             COLOR

             Azul:
             solo visitantes web

             Verde:
             solo oyentes

             Naranja:
             visitantes + oyentes
          */

          let color =
            "#3388ff";


          if (
            grupo.web > 0 &&
            totalEscuchando > 0
          ) {

            color =
              "#ffb020";

          }
          else if (
            totalEscuchando > 0
          ) {

            color =
              "#20c997";

          }


          const icono =
            L.divIcon({

              className: "",

              html:
                `
                <div
                  class="marcador-cantidad"
                  style="
                    background:${color};
                  "
                >
                  ${totalLugar}
                </div>
                `,

              iconSize:
                [34,34],

              iconAnchor:
                [17,17],

              popupAnchor:
                [0,-18]

            });


          /* =================================
             DISPOSITIVOS
          ================================= */

          const dispositivosWeb =
            [
              ...new Set(
                grupo.dispositivosWeb
              )
            ];


          const dispositivosOyentes =
            [
              ...new Set(
                grupo.dispositivosOyentes
              )
            ];


          let textoDispositivosWeb =
            "—";


          if (
            dispositivosWeb.length > 0
          ) {

            textoDispositivosWeb =
              dispositivosWeb
                .map(
                  d =>
                    escapar(d)
                )
                .join(", ");

          }


          let textoDispositivosOyentes =
            "—";


          if (
            dispositivosOyentes.length > 0
          ) {

            textoDispositivosOyentes =
              dispositivosOyentes
                .map(
                  d =>
                    escapar(d)
                )
                .join(", ");

          }


          /* =================================
             POPUP
          ================================= */

          const popup =
            `

            <div
              style="
                min-width:220px;
                line-height:1.6;
              "
            >

              <strong
                style="
                  font-size:16px;
                "
              >
                📍
                ${escapar(
                  grupo.ubicacion.city
                )}
              </strong>

              <br>

              ${escapar(
                grupo.ubicacion.region
              )},
              ${escapar(
                grupo.ubicacion.country
              )}

              <hr>

              👥
              <strong>
                En la web:
              </strong>

              ${grupo.web}

              <br>

              🎧
              <strong>
                Escuchando:
              </strong>

              ${totalEscuchando}

              <br><br>

              📺 Principal:
              <strong>
                ${grupo.principal}
              </strong>

              <br>

              📱 Vertical:
              <strong>
                ${grupo.vertical}
              </strong>

              <hr>

              💻
              <strong>
                Web:
              </strong>

              ${textoDispositivosWeb}

              <br>

              🎧
              <strong>
                Oyentes:
              </strong>

              ${textoDispositivosOyentes}

            </div>

            `;


          L.marker(

            [
              grupo.ubicacion.lat,
              grupo.ubicacion.lon
            ],

            {
              icon: icono
            }

          )
          .bindPopup(
            popup
          )
          .addTo(
            capaMarcadores
          );

        }
      );

    }


    /* =========================================
       FIREBASE - VISITANTES WEB
    ========================================= */

    const conexionesRef =
      ref(
        db,
        "conexiones"
      );


    onValue(

      conexionesRef,

      snapshot => {

        conexionesWeb =
          snapshot.val() ||
          {};


        /*
           ACTUALIZACIÓN INMEDIATA
        */

        actualizarMapa();

      },

      error => {

        console.error(
          "Error leyendo conexiones:",
          error
        );

      }

    );


    /* =========================================
       FIREBASE - OYENTES
    ========================================= */

    const oyentesRef =
      ref(
        db,
        "oyentes_en_vivo"
      );


    onValue(

      oyentesRef,

      snapshot => {

        oyentesEnVivo =
          snapshot.val() ||
          {};


        /*
           ACTUALIZACIÓN INMEDIATA
        */

        actualizarMapa();

      },

      error => {

        console.error(
          "Error leyendo oyentes:",
          error
        );

      }

    );


    /* =========================================
       LIMPIEZA VISUAL

       Cada 10 segundos volvemos a comprobar
       los timestamps.

       Firebase actualiza inmediatamente,
       pero esto permite que desaparezcan
       registros cuyo heartbeat quedó viejo.
    ========================================= */

    setInterval(
      actualizarMapa,
      10000
    );


    /* =========================================
       FECHA LOCAL
    ========================================= */

    function obtenerFechaLocal() {

      const ahora =
        new Date();


      const year =
        ahora.getFullYear();


      const month =
        String(
          ahora.getMonth() + 1
        )
        .padStart(
          2,
          "0"
        );


      const day =
        String(
          ahora.getDate()
        )
        .padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }


    /* =========================================
       ESTADÍSTICAS DIARIAS
    ========================================= */

    const fechaHoy =
      obtenerFechaLocal();


    const diarioRef =
      ref(

        db,

        "conexiones_diarias/" +
        fechaHoy

      );


    onValue(

      diarioRef,

      snapshot => {

        const datos =
          snapshot.val() ||
          {};


        const lista =
          document.getElementById(
            "lista-regiones"
          );


        lista.innerHTML =
          "";


        const regiones =
          Object.entries(
            datos
          );


        regiones.sort(
          (a,b) =>
            Number(b[1] || 0) -
            Number(a[1] || 0)
        );


        if (
          regiones.length === 0
        ) {

          lista.textContent =
            "Todavía no hay visitas registradas hoy.";

          return;

        }


        let totalDia =
          0;


        regiones.forEach(
          ([region, cantidad]) => {

            const numero =
              Number(cantidad) ||
              0;


            totalDia +=
              numero;


            const fila =
              document.createElement(
                "div"
              );


            fila.className =
              "region";


            const nombre =
              document.createElement(
                "span"
              );


            nombre.textContent =
              region;


            const total =
              document.createElement(
                "strong"
              );


            total.textContent =
              numero;


            fila.appendChild(
              nombre
            );


            fila.appendChild(
              total
            );


            lista.appendChild(
              fila
            );

          }
        );


        const filaTotal =
          document.createElement(
            "div"
          );


        filaTotal.className =
          "region";


        const textoTotal =
          document.createElement(
            "span"
          );


        const strong =
          document.createElement(
            "strong"
          );


        strong.textContent =
          "Total de hoy";


        textoTotal.appendChild(
          strong
        );


        const numeroTotal =
          document.createElement(
            "strong"
          );


        numeroTotal.textContent =
          totalDia;


        filaTotal.appendChild(
          textoTotal
        );


        filaTotal.appendChild(
          numeroTotal
        );


        lista.appendChild(
          filaTotal
        );

      },

      error => {

        console.error(
          "Error leyendo estadísticas:",
          error
        );

      }

    );


  </script>

</body>

</html>
