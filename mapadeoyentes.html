<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mapa de Oyentes - Radiophonica</title>


  <!-- LEAFLET -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #111;

      color: white;

      font-family:
        Arial,
        sans-serif;

    }


    /* =========================================
       CABECERA
    ========================================= */

    #cabecera {

      background: #181818;

      padding: 18px 15px;

      text-align: center;

      border-bottom:
        1px solid #333;

    }


    #cabecera h1 {

      margin: 0 0 12px 0;

      font-size: 25px;

    }


    #resumen {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;

    }


    .tarjeta {

      background: #242424;

      border-radius: 10px;

      padding: 10px 16px;

      min-width: 150px;

      font-size: 14px;

    }


    .tarjeta strong {

      display: block;

      font-size: 22px;

      margin-top: 4px;

    }


    /* =========================================
       MAPA
    ========================================= */

    #map {

      width: 100%;

      height: 65vh;

      min-height: 430px;

    }


    /* =========================================
       LEYENDA
    ========================================= */

    #leyenda {

      background: #181818;

      padding: 12px;

      text-align: center;

      font-size: 14px;

      border-top:
        1px solid #333;

    }


    .leyenda-item {

      display: inline-block;

      margin: 5px 10px;

    }


    .punto {

      width: 12px;

      height: 12px;

      border-radius: 50%;

      display: inline-block;

      margin-right: 5px;

    }


    .web {
      background: #3388ff;
    }


    .principal {
      background: #20c997;
    }


    .vertical {
      background: #ff4d6d;
    }


    /* =========================================
       ESTADÍSTICAS DIARIAS
    ========================================= */

    #estadisticas {

      padding: 20px;

      background: #111;

    }


    #estadisticas h2 {

      margin-top: 0;

      text-align: center;

    }


    #lista-regiones {

      max-width: 700px;

      margin: auto;

      background: #1d1d1d;

      border-radius: 10px;

      padding: 15px;

    }


    .region {

      display: flex;

      justify-content: space-between;

      padding: 8px 5px;

      border-bottom:
        1px solid #333;

    }


    .region:last-child {

      border-bottom: none;

    }


    @media (max-width: 600px) {

      #cabecera h1 {
        font-size: 21px;
      }


      .tarjeta {

        min-width: 135px;

        padding: 8px 10px;

      }


      .tarjeta strong {
        font-size: 19px;
      }


      #map {

        height: 60vh;

        min-height: 380px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       CABECERA
  ========================================= -->

  <div id="cabecera">

    <h1>
      🌎 Radiophonica en vivo
    </h1>


    <div id="resumen">


      <div class="tarjeta">

        👥 En la web

        <strong id="total-web">
          0
        </strong>

      </div>


      <div class="tarjeta">

        🎧 Escuchando ahora

        <strong id="total-oyentes">
          0
        </strong>

      </div>


      <div class="tarjeta">

        📺 Principal

        <strong id="total-principal">
          0
        </strong>

      </div>


      <div class="tarjeta">

        📱 Vertical

        <strong id="total-vertical">
          0
        </strong>

      </div>


    </div>

  </div>



  <!-- =========================================
       MAPA
  ========================================= -->

  <div id="map"></div>



  <!-- =========================================
       LEYENDA
  ========================================= -->

  <div id="leyenda">

    <span class="leyenda-item">

      <span class="punto web"></span>

      Visitante web

    </span>


    <span class="leyenda-item">

      <span class="punto principal"></span>

      Oyente Principal

    </span>


    <span class="leyenda-item">

      <span class="punto vertical"></span>

      Oyente Vertical

    </span>

  </div>



  <!-- =========================================
       ESTADÍSTICAS DEL DÍA
  ========================================= -->

  <div id="estadisticas">

    <h2>
      📊 Visitas de hoy por región
    </h2>

    <div id="lista-regiones">

      Cargando estadísticas...

    </div>

  </div>



  <!-- =========================================
       LEAFLET
  ========================================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>



  <!-- =========================================
       FIREBASE
  ========================================= -->

  <script type="module">


    import {

      initializeApp

    }

    from

    "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";


    import {

      getDatabase,
      ref,
      onValue

    }

    from

    "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";



    /* =========================================
       CONFIGURACIÓN FIREBASE
    ========================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAC-9LQSlelDVx27wd2DPxisi4M-lRwtrk",

      authDomain:
        "contador-de-personas-5f8aa.firebaseapp.com",

      databaseURL:
        "https://contador-de-personas-5f8aa-default-rtdb.firebaseio.com",

      projectId:
        "contador-de-personas-5f8aa",

      storageBucket:
        "contador-de-personas-5f8aa.appspot.com",

      messagingSenderId:
        "1063230344919",

      appId:
        "1:1063230344919:web:ed86a937ba176dddb1aa92"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getDatabase(app);



    /* =========================================
       MAPA
    ========================================= */

    const map =
      L.map(
        "map"
      ).setView(
        [-20, -60],
        3
      );


    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap"

      }

    ).addTo(map);



    /* =========================================
       VARIABLES
    ========================================= */

    const TIEMPO_ACTIVO =
      90 * 1000;


    let conexionesWeb = {};

    let oyentesEnVivo = {};


    const marcadores =
      L.layerGroup()
        .addTo(map);



    /* =========================================
       COLORES DE MARCADORES
    ========================================= */

    function crearIcono(color) {

      return L.divIcon({

        className: "",

        html:
          `
          <div
            style="
              width:18px;
              height:18px;
              background:${color};
              border:3px solid white;
              border-radius:50%;
              box-shadow:0 0 8px rgba(0,0,0,.7);
            "
          ></div>
          `,

        iconSize:
          [18,18],

        iconAnchor:
          [9,9]

      });

    }


    const iconoWeb =
      crearIcono(
        "#3388ff"
      );


    const iconoPrincipal =
      crearIcono(
        "#20c997"
      );


    const iconoVertical =
      crearIcono(
        "#ff4d6d"
      );



    /* =========================================
       VALIDAR CONEXIÓN ACTIVA
    ========================================= */

    function estaActivo(conexion) {

      if (!conexion) {
        return false;
      }


      const timestamp =
        Number(
          conexion.timestamp
        );


      if (
        !Number.isFinite(timestamp)
      ) {

        return false;

      }


      const antiguedad =
        Date.now() -
        timestamp;


      return (

        antiguedad >= 0 &&

        antiguedad <=
          TIEMPO_ACTIVO

      );

    }



    /* =========================================
       VALIDAR UBICACIÓN
    ========================================= */

    function obtenerUbicacion(conexion) {

      if (
        !conexion ||
        !conexion.ubicacion
      ) {

        return null;

      }


      const ubicacion =
        conexion.ubicacion;


      const lat =
        Number(
          ubicacion.lat
        );


      const lon =
        Number(
          ubicacion.lon
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        return null;

      }


      /*
      Evitamos interpretar null como 0.

      Si todavía se está obteniendo
      la ubicación, no ponemos el
      marcador en África por accidente.
      */

      if (
        ubicacion.lat === null ||
        ubicacion.lon === null
      ) {

        return null;

      }


      return {

        lat,
        lon,

        city:
          ubicacion.city ||
          "Ciudad desconocida",

        region:
          ubicacion.region ||
          "Región desconocida",

        country:
          ubicacion.country ||
          "País desconocido"

      };

    }



    /* =========================================
       ESCAPAR TEXTO
    ========================================= */

    function escapar(texto) {

      return String(
        texto ?? ""
      )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

    }



    /* =========================================
       ACTUALIZAR MAPA
    ========================================= */

    function actualizarMapa() {


      marcadores.clearLayers();


      let totalWeb =
        0;


      let totalOyentes =
        0;


      let totalPrincipal =
        0;


      let totalVertical =
        0;



      /* =====================================
         VISITANTES DE LA WEB
      ===================================== */

      for (
        const conexion
        of
        Object.values(conexionesWeb)
      ) {


        if (
          !estaActivo(conexion)
        ) {

          continue;

        }


        totalWeb++;


        const ubicacion =
          obtenerUbicacion(
            conexion
          );


        if (!ubicacion) {

          continue;

        }


        const pagina =
          conexion.pagina ||
          "/";


        const dispositivo =
          conexion.dispositivo ||
          "Desconocido";


        L.marker(

          [
            ubicacion.lat,
            ubicacion.lon
          ],

          {
            icon:
              iconoWeb
          }

        )

        .bindPopup(

          `
          <strong>
            👥 Visitante web
          </strong>

          <br><br>

          📍
          ${escapar(ubicacion.city)},
          ${escapar(ubicacion.country)}

          <br>

          🗺️
          ${escapar(ubicacion.region)}

          <br>

          💻
          ${escapar(dispositivo)}

          <br>

          🌐
          ${escapar(pagina)}
          `

        )

        .addTo(
          marcadores
        );

      }



      /* =====================================
         OYENTES REALES
      ===================================== */

      for (
        const oyente
        of
        Object.values(oyentesEnVivo)
      ) {


        if (
          !estaActivo(oyente)
        ) {

          continue;

        }


        totalOyentes++;


        const tipo =
          oyente.tipo ||
          "principal";


        if (
          tipo === "vertical"
        ) {

          totalVertical++;

        }

        else {

          totalPrincipal++;

        }


        const ubicacion =
          obtenerUbicacion(
            oyente
          );


        if (!ubicacion) {

          continue;

        }


        const dispositivo =
          oyente.dispositivo ||
          "Desconocido";


        const esVertical =
          tipo === "vertical";


        const icono =
          esVertical
            ? iconoVertical
            : iconoPrincipal;


        const nombreReproductor =
          esVertical
            ? "Vertical"
            : "Principal";


        const emoji =
          esVertical
            ? "📱"
            : "📺";


        L.marker(

          [
            ubicacion.lat,
            ubicacion.lon
          ],

          {
            icon
          }

        )

        .bindPopup(

          `
          <strong>
            🎧 Oyente en vivo
          </strong>

          <br><br>

          ${emoji}
          Reproductor:
          <strong>
            ${nombreReproductor}
          </strong>

          <br>

          📍
          ${escapar(ubicacion.city)},
          ${escapar(ubicacion.country)}

          <br>

          🗺️
          ${escapar(ubicacion.region)}

          <br>

          💻
          ${escapar(dispositivo)}
          `

        )

        .addTo(
          marcadores
        );

      }



      /* =====================================
         ACTUALIZAR CONTADORES
      ===================================== */

      document
        .getElementById(
          "total-web"
        )
        .textContent =
          totalWeb;


      document
        .getElementById(
          "total-oyentes"
        )
        .textContent =
          totalOyentes;


      document
        .getElementById(
          "total-principal"
        )
        .textContent =
          totalPrincipal;


      document
        .getElementById(
          "total-vertical"
        )
        .textContent =
          totalVertical;

    }



    /* =========================================
       FIREBASE:
       PERSONAS EN LA WEB
    ========================================= */

    const conexionesRef =
      ref(
        db,
        "conexiones"
      );


    onValue(

      conexionesRef,

      snapshot => {

        conexionesWeb =
          snapshot.val() ||
          {};


        actualizarMapa();

      }

    );



    /* =========================================
       FIREBASE:
       OYENTES REALES
    ========================================= */

    const oyentesRef =
      ref(
        db,
        "oyentes_en_vivo"
      );


    onValue(

      oyentesRef,

      snapshot => {

        oyentesEnVivo =
          snapshot.val() ||
          {};


        actualizarMapa();

      }

    );



    /* =========================================
       RECALCULAR CADA 15 SEGUNDOS
    ========================================= */

    setInterval(

      actualizarMapa,

      15000

    );



    /* =========================================
       ESTADÍSTICAS DIARIAS
    ========================================= */

    function obtenerFechaLocal() {

      const ahora =
        new Date();


      const year =
        ahora.getFullYear();


      const month =
        String(
          ahora.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          ahora.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }


    const fechaHoy =
      obtenerFechaLocal();


    const diarioRef =
      ref(

        db,

        "conexiones_diarias/" +
        fechaHoy

      );


    onValue(

      diarioRef,

      snapshot => {


        const datos =
          snapshot.val() ||
          {};


        const lista =
          document.getElementById(
            "lista-regiones"
          );


        lista.innerHTML =
          "";


        const regiones =
          Object.entries(
            datos
          );


        regiones.sort(

          (a,b) =>

            Number(b[1] || 0) -
            Number(a[1] || 0)

        );


        if (
          regiones.length === 0
        ) {

          lista.innerHTML =
            "Todavía no hay visitas registradas hoy.";

          return;

        }


        let totalDia =
          0;


        for (
          const [
            region,
            cantidad
          ]
          of regiones
        ) {


          const numero =
            Number(cantidad) ||
            0;


          totalDia +=
            numero;


          const fila =
            document.createElement(
              "div"
            );


          fila.className =
            "region";


          const nombre =
            document.createElement(
              "span"
            );


          nombre.textContent =
            region;


          const total =
            document.createElement(
              "strong"
            );


          total.textContent =
            numero;


          fila.appendChild(
            nombre
          );


          fila.appendChild(
            total
          );


          lista.appendChild(
            fila
          );

        }


        const filaTotal =
          document.createElement(
            "div"
          );


        filaTotal.className =
          "region";


        const textoTotal =
          document.createElement(
            "span"
          );


        textoTotal.innerHTML =
          "<strong>Total de hoy</strong>";


        const numeroTotal =
          document.createElement(
            "strong"
          );


        numeroTotal.textContent =
          totalDia;


        filaTotal.appendChild(
          textoTotal
        );


        filaTotal.appendChild(
          numeroTotal
        );


        lista.appendChild(
          filaTotal
        );

      }

    );


  </script>


</body>

</html>
