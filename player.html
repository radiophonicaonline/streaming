<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html,body{
margin:0;
background:black;
overflow:hidden;
}

video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
background:black;
}

#nowPlayingOverlay{
position:absolute;
left:24px;
bottom:24px;
z-index:10;
max-width:min(70%, 760px);
padding:10px 16px;
color:#fff;
background:rgba(0,0,0,.72);
border-left:4px solid #55c9ef;
font-family:Arial, sans-serif;
font-size:clamp(14px, 2vw, 24px);
font-weight:600;
line-height:1.25;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
text-shadow:0 1px 2px rgba(0,0,0,.7);
box-sizing:border-box;
}

#nowPlayingOverlay.hidden{display:none;}
</style>
</head>

<body>

<video id="main" autoplay></video>
<video id="fx" style="display:none"></video>
<div id="nowPlayingOverlay" class="hidden" aria-live="polite"></div>

<script>

const canal = new BroadcastChannel("obs_player");

const main = document.getElementById("main");
const fx = document.getElementById("fx");
const nowPlayingOverlay = document.getElementById("nowPlayingOverlay");

let autoplay = true;

function showNowPlaying(name){
  const title = (name || "Archivo en reproducción").trim();
  nowPlayingOverlay.textContent = title;
  nowPlayingOverlay.classList.remove("hidden");
}

/* =====================
   PLAY VIDEO
===================== */

function playFile(file, name){

if(!file) return;
showNowPlaying(name || file.name || "Archivo en reproducción");
main.src = URL.createObjectURL(file);
main.play().catch(err => console.warn("No se pudo iniciar la reproducción:", err));

}

/* =====================
   FX
===================== */

function playFX(file, name){

if(!file) return;
showNowPlaying(name ? "FX · " + name : (file.name || "FX"));
fx.src = URL.createObjectURL(file);

fx.style.display="block";

fx.volume = main.volume;

fx.onended=()=>{
fx.style.display="none";
};

fx.play().catch(err => console.warn("No se pudo reproducir el FX:", err));

}

/* =====================
   CUANDO TERMINA
===================== */

main.onended=()=>{

if(!autoplay) return;

canal.postMessage({
type:"next"
});

};

/* =====================
   CONTROLES
===================== */

function play(){ main.play(); }
function pause(){ main.pause(); }

function stop(){

main.pause();
main.currentTime=0;

}

/* =====================
   MENSAJES PANEL
===================== */

canal.onmessage=e=>{

const d=e.data;

switch(d.type){

case "playFile":
playFile(d.file, d.name);
break;

case "fx":
playFX(d.file, d.name);
break;

case "play":
play();
break;

case "pause":
pause();
break;

case "stop":
stop();
break;

case "volume":
main.volume=d.value;
fx.volume=d.value;
break;

case "setAutoplay":
autoplay=d.value;
break;

case "forward":
main.currentTime += 10;
break;

case "back":
main.currentTime -= 10;
break;
}

};

</script>

</body>
</html>
