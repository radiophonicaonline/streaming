<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

html,body{margin:0;background:black;overflow:hidden;}

/* NOW PLAYING shared visual system */
#nowPlayingOverlay{
  --np-accent:#55c9ef;
  position:absolute;
  z-index:50;
  width:min(520px,calc(100% - 28px));
  min-height:76px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 18px 12px 12px;
  box-sizing:border-box;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(110deg,rgba(9,15,21,.94),rgba(17,25,33,.82));
  border:1px solid rgba(255,255,255,.13);
  border-left:4px solid var(--np-accent);
  border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.38);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:1;
  transform:translateY(0);
  visibility:visible;
  transition:opacity .28s ease,transform .28s ease,visibility .28s ease;
  pointer-events:none;
}
#nowPlayingOverlay.hidden{opacity:0;visibility:hidden;}
#npArtwork{
  width:52px;height:52px;flex:0 0 52px;
  display:flex;align-items:center;justify-content:center;
  border-radius:7px;
  background:linear-gradient(145deg,#183747,#101a24);
  border:1px solid color-mix(in srgb,var(--np-accent) 65%,transparent);
  color:#75d9f5;font-size:25px;font-weight:700;letter-spacing:-2px;
}
#npArtwork img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit;}
#npArtwork.has-logo{padding:3px;box-sizing:border-box;background:rgba(255,255,255,.06);}
#npInfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px;}
#npLabel{color:var(--np-accent);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
#npTitle{color:#fff;font-size:clamp(14px,1.6vw,19px);font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.45);}
#npSubtitle{display:none;}
#npAccent{width:3px;height:34px;flex:0 0 3px;border-radius:3px;background:linear-gradient(to bottom,#70e0f7,#2685ad);}

/* Positions */
#nowPlayingOverlay[data-position="top-left"]{top:18px;left:18px;bottom:auto;right:auto;}
#nowPlayingOverlay[data-position="top-center"]{top:18px;left:50%;bottom:auto;right:auto;transform:translateX(-50%);}
#nowPlayingOverlay[data-position="top-right"]{top:18px;right:18px;bottom:auto;left:auto;}
#nowPlayingOverlay[data-position="middle-left"]{top:50%;left:18px;bottom:auto;right:auto;transform:translateY(-50%);}
#nowPlayingOverlay[data-position="middle-right"]{top:50%;right:18px;bottom:auto;left:auto;transform:translateY(-50%);}
#nowPlayingOverlay[data-position="bottom-left"]{bottom:18px;left:18px;top:auto;right:auto;}
#nowPlayingOverlay[data-position="bottom-center"]{bottom:18px;left:50%;top:auto;right:auto;transform:translateX(-50%);}
#nowPlayingOverlay[data-position="bottom-right"]{bottom:18px;right:18px;top:auto;left:auto;}

/* Design variants */
#nowPlayingOverlay[data-style="spotify"]{
  width:min(440px,calc(100% - 28px));min-height:94px;padding:14px;
  border:1px solid rgba(255,255,255,.12);border-left:0;border-radius:13px;
  background:rgba(12,12,14,.94);
}
#nowPlayingOverlay[data-style="spotify"] #npArtwork{width:66px;height:66px;flex-basis:66px;border-radius:5px;}
#nowPlayingOverlay[data-style="spotify"] #npLabel{letter-spacing:1.4px;}
#nowPlayingOverlay[data-style="minimal"]{
  width:min(560px,calc(100% - 28px));min-height:0;padding:10px 16px;
  gap:10px;border:0;border-left:3px solid var(--np-accent);border-radius:3px;
  background:rgba(8,12,16,.78);box-shadow:0 4px 18px rgba(0,0,0,.22);
}
#nowPlayingOverlay[data-style="minimal"] #npArtwork,
#nowPlayingOverlay[data-style="minimal"] #npAccent{display:none;}
#nowPlayingOverlay[data-style="minimal"] #npInfo{gap:3px;}
#nowPlayingOverlay[data-style="ticker"]{
  width:min(720px,calc(100% - 28px));min-height:0;padding:12px 18px;
  border:0;border-left:4px solid var(--np-accent);border-radius:5px;
  background:rgba(7,13,18,.88);
}
#nowPlayingOverlay[data-style="ticker"] #npArtwork{width:34px;height:34px;flex-basis:34px;font-size:18px;}
#nowPlayingOverlay[data-style="ticker"] #npInfo{flex-direction:row;align-items:center;gap:12px;overflow:hidden;}
#nowPlayingOverlay[data-style="ticker"] #npLabel{white-space:nowrap;}
#nowPlayingOverlay[data-style="ticker"] #npTitle{overflow:hidden;text-overflow:ellipsis;}
#nowPlayingOverlay[data-style="ticker"] #npSubtitle{white-space:nowrap;}

#nowPlayingOverlay{position:fixed;}

video{position:absolute;width:100%;height:100%;object-fit:cover;background:black;}

/* NOW PLAYING size presets */
#nowPlayingOverlay{
  --np-art-size:52px;
  --np-title-size:clamp(14px,1.6vw,19px);
  --np-label-size:10px;
  --np-sub-size:10px;
  --np-pad-y:12px;
  --np-pad-left:12px;
  --np-pad-right:18px;
  --np-gap:14px;
  --np-min-height:76px;
  gap:var(--np-gap);
  padding:var(--np-pad-y) var(--np-pad-right) var(--np-pad-y) var(--np-pad-left);
  min-height:var(--np-min-height);
}
#npArtwork{width:var(--np-art-size);height:var(--np-art-size);flex-basis:var(--np-art-size);}
#npTitle{font-size:var(--np-title-size);}
#npLabel{font-size:var(--np-label-size);}
#npSubtitle{font-size:var(--np-sub-size);}
#nowPlayingOverlay[data-size="small"]{
  --np-art-size:40px;--np-title-size:14px;--np-label-size:8px;--np-sub-size:8px;
  --np-pad-y:8px;--np-pad-left:9px;--np-pad-right:13px;--np-gap:10px;--np-min-height:56px;
  width:min(390px,calc(100% - 24px));
}
#nowPlayingOverlay[data-size="medium"]{
  --np-art-size:52px;--np-title-size:clamp(14px,1.6vw,19px);--np-label-size:10px;--np-sub-size:10px;
  --np-pad-y:12px;--np-pad-left:12px;--np-pad-right:18px;--np-gap:14px;--np-min-height:76px;
  width:min(520px,calc(100% - 28px));
}
#nowPlayingOverlay[data-size="large"]{
  --np-art-size:70px;--np-title-size:clamp(19px,2.1vw,25px);--np-label-size:12px;--np-sub-size:12px;
  --np-pad-y:16px;--np-pad-left:16px;--np-pad-right:22px;--np-gap:17px;--np-min-height:100px;
  width:min(620px,calc(100% - 32px));
}
#nowPlayingOverlay[data-size="xlarge"]{
  --np-art-size:90px;--np-title-size:clamp(23px,2.7vw,32px);--np-label-size:14px;--np-sub-size:13px;
  --np-pad-y:20px;--np-pad-left:20px;--np-pad-right:26px;--np-gap:20px;--np-min-height:128px;
  width:min(760px,calc(100% - 36px));
}
/* Keep the selected size coherent with alternate layouts. */
#nowPlayingOverlay[data-style="spotify"] #npArtwork{width:var(--np-art-size);height:var(--np-art-size);flex-basis:var(--np-art-size);}
#nowPlayingOverlay[data-style="minimal"]{padding:var(--np-pad-y) var(--np-pad-right) var(--np-pad-y) var(--np-pad-left);}
#nowPlayingOverlay[data-style="ticker"]{padding:var(--np-pad-y) var(--np-pad-right);}
#nowPlayingOverlay[data-style="ticker"] #npArtwork{width:var(--np-art-size);height:var(--np-art-size);flex-basis:var(--np-art-size);}


/* Pantalla visual para locuciones dinámicas */
#hourVisual{
  position:fixed;inset:0;z-index:40;display:none;align-items:center;
  justify-content:center;flex-direction:column;gap:clamp(12px,2.5vh,26px);
  overflow:hidden;background:
    radial-gradient(ellipse at 50% 42%,rgba(20,72,96,.42),transparent 55%),
    linear-gradient(145deg,#05090e,#0a121a 58%,#05080c);
  color:#f5fbff;font-family:Arial,Helvetica,sans-serif;text-align:center;
}
#hourVisual.active{display:flex;}
#hourVisual:before,#hourVisual:after{
  content:"";position:absolute;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(85,201,239,.32),transparent);
}
#hourVisual:before{top:16%}#hourVisual:after{bottom:16%}
#hourEyebrow{font-size:clamp(11px,1.5vw,18px);letter-spacing:.42em;color:#69cce9;font-weight:700}
#hourDigits{
  font-size:clamp(90px,22vw,280px);font-weight:300;letter-spacing:.035em;
  line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 34px rgba(64,190,235,.18);
}
#hourCaption{font-size:clamp(13px,2vw,24px);letter-spacing:.24em;color:#a9c5d2}
#hourEqualizer{height:58px;display:flex;align-items:center;justify-content:center;gap:6px}
#hourEqualizer span{
  display:block;width:5px;height:12px;border-radius:8px;
  background:linear-gradient(180deg,#8be7ff,#238bb5);
  box-shadow:0 0 12px rgba(67,190,235,.35);
  animation:hourEq .78s ease-in-out infinite alternate;
}
#hourEqualizer span:nth-child(3n){animation-delay:-.22s}
#hourEqualizer span:nth-child(3n + 1){animation-delay:-.48s}
#hourEqualizer span:nth-child(4n){animation-duration:.58s}
@keyframes hourEq{from{height:8px;opacity:.55}to{height:52px;opacity:1}}

</style>
</head>

<body>

<video id="main" autoplay></video>
<video id="fx" style="display:none"></video>
<div id="hourVisual" aria-live="polite">
  <div id="hourEyebrow">HORA ACTUAL</div>
  <div id="hourDigits">00:00</div>
  <div id="hourCaption">LOCUCIÓN DE HORA</div>
  <div id="hourEqualizer" aria-hidden="true"></div>
</div>
<div id="nowPlayingOverlay" class="hidden" data-style="professional" data-position="bottom-left" data-size="medium" aria-live="polite">
  <div id="npArtwork" aria-hidden="true">♪</div>
  <div id="npInfo"><div id="npLabel">NOW PLAYING</div><div id="npTitle">Sin reproducción</div></div>
  <div id="npAccent" aria-hidden="true"></div>
</div>

<script>

const canal = new BroadcastChannel("obs_player");
const main = document.getElementById("main");
const fx = document.getElementById("fx");
const nowPlayingOverlay = document.getElementById("nowPlayingOverlay");
const npTitle = document.getElementById("npTitle");
const npSubtitle = document.getElementById("npSubtitle");
const hourVisual = document.getElementById("hourVisual");
const hourDigits = document.getElementById("hourDigits");
const hourCaption = document.getElementById("hourCaption");
const hourEqualizer = document.getElementById("hourEqualizer");
for(let i=0;i<30;i++){
  const bar=document.createElement("span");
  hourEqualizer.appendChild(bar);
}

let autoplay = true;
let playbackOptions = {shuffle:false, stopAtEnd:false, loopTrack:false};
let currentMediaKind = "file";
let lastPlaybackReport = 0;
let activeSequence = null;
let npState = {title:"", subtitle:"", visible:false, style:"professional", position:"bottom-left", size:"medium", logoData:""};
let playerNowPlayingVisible = false;

function saveNpState(){
  try { localStorage.setItem("radiophonica_nowplaying_state", JSON.stringify(npState)); } catch(e){}
}
function applyNpState(){
  nowPlayingOverlay.dataset.style = npState.style || "professional";
  nowPlayingOverlay.dataset.position = npState.position || "bottom-left";
  nowPlayingOverlay.dataset.size = npState.size || "medium";
  npTitle.textContent = npState.title || "Sin reproducción";
  const art = document.getElementById("npArtwork");
  if(npState.logoData){ art.innerHTML = ""; const img=document.createElement("img"); img.src=npState.logoData; img.alt="Logo personalizado"; art.appendChild(img); art.classList.add("has-logo"); }
  else { art.textContent="♪"; art.classList.remove("has-logo"); }
  nowPlayingOverlay.classList.toggle("hidden", !playerNowPlayingVisible);
}
function updateNpState(patch, persist=true){
  npState = {...npState, ...patch};
  applyNpState();
  if(persist) saveNpState();
}
function showNowPlaying(name, kind){
  // El estado compartido actualiza la fuente independiente; la visibilidad
  // integrada se mantiene como control local del reproductor.
  playerNowPlayingVisible = true;
  updateNpState({title:(name || "Archivo en reproducción").trim(), subtitle:"", visible:true});
  canal.postMessage({type:"nowPlayingUpdate", state:npState});
}
function toggleNowPlaying(){
  playerNowPlayingVisible = !playerNowPlayingVisible;
  nowPlayingOverlay.classList.toggle("hidden", !playerNowPlayingVisible);
}
function receiveNpState(state){
  if(!state || typeof state !== "object") return;
  updateNpState({
    title:typeof state.title==="string"?state.title:npState.title,
    subtitle:typeof state.subtitle==="string"?state.subtitle:npState.subtitle,
    visible:typeof state.visible==="boolean"?state.visible:npState.visible,
    style:typeof state.style==="string"?state.style:npState.style,
    position:typeof state.position==="string"?state.position:npState.position,
    size:typeof state.size==="string"?state.size:npState.size,
    logoData:typeof state.logoData==="string"?state.logoData:npState.logoData
  });
}
try {
  const saved = JSON.parse(localStorage.getItem("radiophonica_nowplaying_state") || "null");
  if(saved){ receiveNpState(saved); playerNowPlayingVisible = !!saved.visible; applyNpState(); }
} catch(e){}
window.addEventListener("storage", e=>{
  if(e.key==="radiophonica_nowplaying_state" && e.newValue){
    try { receiveNpState(JSON.parse(e.newValue)); } catch(err){}
  }
});

function showHourVisual(time){
  hourDigits.textContent = time || "--:--";
  hourCaption.textContent = window.currentLocutionCaption || "LOCUCIÓN DE HORA";
  main.style.display = "none";
  hourVisual.classList.add("active");
}
function hideHourVisual(){
  hourVisual.classList.remove("active");
  main.style.display = "block";
}

function playReplay(url, name){
  if(!url) return;
  currentMediaKind = "replay";
  activeSequence = null;
  hideHourVisual();
  showNowPlaying(name || "REPETICIÓN OBS", "REPRODUCIENDO REPLAY");
  main.playbackRate = 1;
  main.src = url;
  main.load();
  main.play().catch(err=>{
    console.warn("No se pudo reproducir el replay:", err);
  });
}

function playFile(file, name){
  if(!file) return;
  currentMediaKind = "file";
  hideHourVisual();
  showNowPlaying(name || file.name || "Archivo en reproducción", "REPRODUCIENDO");
  main.playbackRate = 1;
  main.src = URL.createObjectURL(file);
  main.play().catch(err => console.warn("No se pudo iniciar la reproducción:", err));
}
async function playHourSequence(){
  activeSequence = null;
  showNowPlaying("LOCUCIÓN DE HORA", "CONSULTANDO RELOJ");
  try{
    const response = await fetch("http://127.0.0.1:3030/api/hour-sequence", {cache:"no-store"});
    const data = await response.json();
    if(!response.ok || !data.ok || !Array.isArray(data.files) || data.files.length===0){
      throw new Error((data.missing || []).join(", ") || "No se encontraron los audios de la hora");
    }
    activeSequence = {files:data.files, index:0, spokenTime:data.spokenTime};
    showHourVisual(data.spokenTime);
    showNowPlaying("LOCUCIÓN DE HORA · " + data.spokenTime, "HORA ACTUAL");
    playSequencePart();
  }catch(err){
    console.error("Error en locución de hora:", err);
    showNowPlaying("Error en locución de hora", "REVISAR SERVIDOR / AUDIOS");
    activeSequence = null;
    hideHourVisual();
    canal.postMessage({type:"hourSequenceError", message:String(err.message || err)});
    if(autoplay) canal.postMessage({type:"next"});
  }
}
async function playWeatherSequence(type){
  activeSequence = null;
  const isTemp = type === "temperature";
  const caption = isTemp ? "LOCUCIÓN DE TEMPERATURA" : "LOCUCIÓN DE HUMEDAD";
  window.currentLocutionCaption = caption;
  showNowPlaying(caption, "CONSULTANDO SANTIAGO");
  try{
    const response = await fetch(`http://127.0.0.1:3030/api/weather/${type}`, {cache:"no-store"});
    const data = await response.json();
    if(!response.ok || !data.ok || !data.file || !data.file.url){
      throw new Error(data.error || "No se encontró el audio meteorológico");
    }
    activeSequence = {files:[data.file], index:0, spokenTime:null};
    showHourVisual(isTemp ? `${data.value}°` : `${data.value}%`);
    showNowPlaying(`${caption} · ${data.spokenValue}`, "SANTIAGO · ACTUALIZADO");
    playSequencePart();
  }catch(err){
    console.error(`Error en ${caption}:`, err);
    showNowPlaying(`Error en ${caption}`, "REVISAR SERVIDOR / AUDIOS");
    activeSequence = null;
    hideHourVisual();
    canal.postMessage({type:"weatherSequenceError", weatherType:type, message:String(err.message || err)});
    if(autoplay) canal.postMessage({type:"next"});
  }
}

function playSequencePart(){
  if(!activeSequence) return;
  const part = activeSequence.files[activeSequence.index];
  if(!part) return;
  main.src = part.url;
  main.play().catch(err=>{
    console.error("No se pudo reproducir parte de la locución:", err);
    activeSequence = null;
    if(autoplay) canal.postMessage({type:"next"});
  });
}
function playFX(file, name){
  if(!file) return;
  showNowPlaying(name ? "FX · " + name : (file.name || "FX"), "EFECTO DE SONIDO");
  fx.src = URL.createObjectURL(file);
  fx.style.display="block";
  fx.volume = main.volume;
  fx.onended=()=>{ fx.style.display="none"; };
  fx.play().catch(err => console.warn("No se pudo reproducir el FX:", err));
}
main.onended=()=>{
  // Bucle vuelve a iniciar el archivo actual sin avanzar la playlist.
  if(playbackOptions.loopTrack && !activeSequence){
    main.currentTime=0;
    main.play().catch(err=>console.warn("No se pudo reiniciar el bucle:",err));
    return;
  }
  // Si estamos dentro de una locución dinámica, reproducir el siguiente
  // fragmento antes de avisar al panel que avance la playlist.
  if(activeSequence){
    activeSequence.index++;
    if(activeSequence.index < activeSequence.files.length){
      playSequencePart();
      return;
    }
    activeSequence = null;
    hideHourVisual();
    if(!playbackOptions.stopAtEnd && autoplay) canal.postMessage({type:"next"});
    return;
  }

  if(playbackOptions.stopAtEnd || !autoplay) return;
  canal.postMessage({type:"next"});
};
function play(){
  main.play().catch(err=>console.warn("No se pudo reanudar:",err));
}
function pause(){
  main.pause();
  reportPlayback(true);
}
function stop(){
  activeSequence=null;
  hideHourVisual();
  main.pause();
  main.playbackRate=1;
  main.currentTime=0;
  reportPlayback(true);
}

function reportPlayback(force=false){
  const now = Date.now();
  if(!force && now-lastPlaybackReport < 200) return;
  lastPlaybackReport = now;
  const duration = Number.isFinite(main.duration) ? main.duration : 0;
  canal.postMessage({
    type:"playbackTime",
    currentTime:Number.isFinite(main.currentTime)?main.currentTime:0,
    duration:duration,
    paused:main.paused,
    ended:main.ended,
    ready:main.readyState >= 1
  });
}
main.addEventListener("timeupdate", ()=>reportPlayback());
main.addEventListener("durationchange", ()=>reportPlayback(true));
main.addEventListener("loadedmetadata", ()=>reportPlayback(true));
main.addEventListener("play", ()=>reportPlayback(true));
main.addEventListener("pause", ()=>reportPlayback(true));
main.addEventListener("ended", ()=>reportPlayback(true));

canal.onmessage=e=>{
  const d=e.data || {};
  switch(d.type){
    case "playFile": playFile(d.file, d.name); break;
     case "playReplay": playReplay(d.url, d.name); break;
     case "playHour": window.currentLocutionCaption="LOCUCIÓN DE HORA"; playHourSequence(); break;
    case "playWeather": playWeatherSequence(d.weatherType); break;
    case "fx": playFX(d.file, d.name); break;
    case "toggleNowPlaying": toggleNowPlaying(); break;
    case "togglePlayerNowPlaying": toggleNowPlaying(); break;
    case "setNowPlayingVisibility": break;
    case "setNowPlayingConfig": receiveNpState(d.state); saveNpState(); canal.postMessage({type:"nowPlayingState",state:npState}); break;
    case "requestNowPlayingState":
      canal.postMessage({type:"nowPlayingState",state:npState});
      break;
    case "nowPlayingConfig": case "nowPlayingState": case "nowPlayingUpdate":
      receiveNpState(d.state);
      break;
    case "showNowPlaying": updateNpState({visible:true}); break;
    case "hideNowPlaying": updateNpState({visible:false}); break;
    case "play": play(); break;
    case "pause": pause(); break;
    case "stop": stop(); break;
    case "volume": main.volume=d.value; fx.volume=d.value; break;
    case "setAutoplay": autoplay=d.value; break;
    case "setPlaybackOptions":
      if(d.options && typeof d.options === "object") playbackOptions={...playbackOptions,...d.options};
      break;
    case "forward": main.currentTime=Math.min((Number.isFinite(main.duration)?main.duration:main.currentTime+10),main.currentTime+10); reportPlayback(true); break;
    case "back": main.currentTime=Math.max(0,main.currentTime-10); reportPlayback(true); break;
    case "seek":
      if(Number.isFinite(main.duration) && main.duration>0){
        main.currentTime=Math.max(0,Math.min(main.duration,Number(d.value)||0));
        reportPlayback(true);
      }
      break;
    case "requestPlaybackTime": reportPlayback(true); break;
  }
};
canal.postMessage({type:"requestNowPlayingState"});
canal.postMessage({type:"requestPlaybackOptions"});

</script>

</body>
</html>
